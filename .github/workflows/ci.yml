name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate TOML, Python, and Bash scripts
        run: |
          python3 -c "import tomllib; tomllib.load(open('log-report/task.toml', 'rb'))"
          python3 -m py_compile log-report/solution/solve.py log-report/tests/test_outputs.py
          bash -n log-report/solution/solve.sh log-report/tests/test.sh
